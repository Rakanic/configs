set -g default-terminal "xterm-256color"

# Better color support if your terminal supports truecolor
set -as terminal-overrides ",*:Tc"

set -g set-titles on
set -g set-titles-string '#h'

# --- Mouse ---
set -g mouse on
set -g set-clipboard on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind t
bind-key t run-shell 'if [ "$(tmux show -gv mouse)" = "on" ]; then tmux set -g mouse off \; display-message "Mouse: OFF"; else tmux set -g mouse on \; display-message "Mouse: ON"; fi'

# --- Resize panes with arrow keys ---
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# --- Move between panes with Vim keys ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Toggle zoom
bind -r m resize-pane -Z

# Split bindings
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# --- Numbering ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- General behavior ---
set -s escape-time 0
setw -g aggressive-resize off
set -g history-limit 100000
set -g status-keys vi
setw -g mode-keys vi

# =========================================================
# THEME: black + orange
# =========================================================

# Status bar at bottom
set -g status-position bottom
set -g status-style "bg=colour233,fg=colour250"

# Left: small orange prefix-indicator pill
set -g status-left "#[fg=colour208,bg=colour233,bold]#{?client_prefix,● ,◐ }"

# Right: session name on an orange pill, then date/time
set -g status-right "#[fg=colour208,bg=colour233]#[fg=colour233,bg=colour208,bold] #S #[fg=colour208,bg=colour233]#[fg=colour244,bg=colour233] %a %b %d #[fg=colour208,bg=colour233]#[fg=colour250,bg=colour233,bold] %H:%M "

set -g status-left-length  20
set -g status-right-length 80

# Center the tabs/window list
set -g status-justify centre

# Window tabs — slanted transitions between active tab and bar
setw -g window-status-separator " "
setw -g window-status-format         "#[fg=colour244,bg=colour233] #I  #W "
setw -g window-status-current-format "#[fg=colour208,bg=colour233]#[fg=colour233,bg=colour208,bold] #I  #W #[fg=colour208,bg=colour233]"

# Pane borders — dim when inactive, bright orange when active
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour237"
set -g pane-active-border-style "fg=colour208,bold"

# Show pane names on borders (very nice when many panes are open)
set -g pane-border-status top
set -g pane-border-format " #[fg=colour208,bold]#{pane_index} #[fg=colour245]#{pane_current_command}#{?pane_active, #[fg=colour208],}"

# Copy mode / selection
setw -g mode-style "bg=colour208,fg=colour233,bold"

# Messages / command prompt
set -g message-style "bg=colour208,fg=colour233,bold"
set -g message-command-style "bg=colour208,fg=colour233,bold"

